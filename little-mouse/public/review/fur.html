<!doctype html><meta charset="utf-8"><title>Opaque coat volume</title>
<style>body{margin:0;background:#ddd;font:16px system-ui}main{display:grid;grid-template-columns:1fr 1fr}section{position:relative}canvas{width:100%;height:320px;display:block}label{position:absolute;left:16px;top:12px;background:#ffffffdd;padding:6px;border-radius:5px}h1,p{margin:14px}</style>
<h1>Opaque coat volume · seed 314159</h1><p>Identity seed 314159, lemon stripes · same pose and camera · daylight / moonlight × pale / dark floor. Desktop diagnostic, not device acceptance.</p><main></main>
<script type="module">
import * as T from '../vendor/three.module.js';import{makeMouse,disposeMouse}from'../mouse3d.js';import{createMouseIdentity}from'../mouse-identity.js';import{createLighting}from'../lighting.js';
const params=new URLSearchParams(location.search),coat=params.get('coat')==='19'?19:0,level=params.get('level')||'default',config=level==='max'?{bodyHairiness:1.5,armHairiness:1.5,furLength:1.8}:level==='bare'?{bodyHairiness:0,armHairiness:0}:{};if(params.has('fuzz'))config.furSoftness=Number(params.get('fuzz'));const identity={...createMouseIdentity(314159),coat},diagnostics=[];document.querySelector('p').textContent=`${coat===19?'Lemon stripes':'Agouti'} · ${level} density/length · fuzziness ${config.furSoftness??'default'} · rest, grooming, run bend, active hindpaw drag · desktop review only.`;
for(const pose of ['rest','groom','run bend','held hindpaw'])for(const view of ['top','side']){const floor='#e6e3d9',lighting='daylight';
 const section=document.createElement('section'),canvas=document.createElement('canvas');section.style.background=floor;section.innerHTML=`<label>${pose} · ${view}</label>`;section.append(canvas);document.querySelector('main').append(section);
 const renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setSize(700,320,false);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
 const scene=new T.Scene(),camera=new T.OrthographicCamera(-150,125,80,-80,.1,1000);camera.position.set(0,-100,500);if(view==='side')camera.position.set(0,-350,140);camera.lookAt(0,0,10);camera.zoom=params.get('close')==='1'?1.4:.85;camera.updateProjectionMatrix();const lights=createLighting(scene);lights.update({lighting},700,400);
 const model=makeMouse(0,identity,config);scene.add(model.group);for(let i=0;i<60;i++){const leg=model.legRig.legs[0],moving=pose==='run bend';model.animate(i/60,moving,moving?180:0,1/60,1,.7,false,pose==='groom'?{activity:{kind:'groom',weight:1,elapsed:.3}}:pose==='held hindpaw'?{x:i*3,y:Math.sin(i*.1)*20,heading:0,size:1,held:true,holdReference:{part:'hindpaw',active:true},heldPaw:{index:0,x:leg.layout.anchor[0]+4,y:leg.layout.anchor[1]-10,z:3}}:{},config);}renderer.render(scene,camera);
 const redraw=()=>renderer.render(scene,camera);setTimeout(redraw,700);diagnostics.push({renderer,scene,camera,model,redraw});
}
window.coatReview=diagnostics;
</script>
