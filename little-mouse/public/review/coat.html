<!doctype html><meta charset="utf-8"><title>Coat surface comparison</title>
<style>body{margin:0;background:#ddd;font:16px system-ui}main{display:grid;grid-template-columns:1fr 1fr}section{position:relative}canvas{width:100%;height:400px;display:block}label{position:absolute;left:16px;top:12px;background:#ffffffdd;padding:6px;border-radius:5px}h1,p{margin:14px}</style>
<h1>Stable coat · region surfaces</h1><p>Identity seed 314159, lemon stripes · same pose and camera · daylight / moonlight × pale / dark floor. Desktop diagnostic, not device acceptance.</p><main></main>
<script type="module">
import * as T from '../vendor/three.module.js';import{makeMouse,disposeMouse}from'../mouse3d.js';import{createMouseIdentity}from'../mouse-identity.js';import{createLighting}from'../lighting.js';
const params=new URLSearchParams(location.search),coat=params.get('coat')==='0'?0:19,zoom=params.get('zoom')==='1.8'?1.8:1;
const identity={...createMouseIdentity(314159),coat},diagnostics=[];document.querySelector('p').textContent=`Identity seed 314159, ${coat===0?'agouti brown':'lemon stripes'} · daylight / moonlight × pale / dark floor. Desktop diagnostic, not device acceptance.`;
for(const lighting of ['daylight','moonlight'])for(const floor of ['#ece9df','#293338']){
 const section=document.createElement('section'),canvas=document.createElement('canvas');section.style.background=floor;section.innerHTML=`<label>${lighting} · ${floor}</label>`;section.append(canvas);document.querySelector('main').append(section);
 const renderer=new T.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setSize(700,400,false);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
 const scene=new T.Scene(),camera=new T.OrthographicCamera(-150,125,80,-80,.1,1000);camera.position.set(0,-100,500);camera.lookAt(0,0,10);camera.zoom=zoom;camera.updateProjectionMatrix();const lights=createLighting(scene);lights.update({lighting},700,400);
 const model=makeMouse(0,identity,{});scene.add(model.group);model.animate(0,false,0,0);renderer.render(scene,camera);
 const redraw=()=>renderer.render(scene,camera);setTimeout(redraw,700);diagnostics.push({renderer,scene,camera,model,redraw});
}
window.coatReview=diagnostics;
</script>
